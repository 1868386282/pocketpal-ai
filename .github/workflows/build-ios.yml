name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
      - run: yarn install
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Build iOS
        run: |
          cd ios
          pod install
          xcodebuild -workspace PocketPalAI.xcworkspace -scheme PocketPalAI -configuration Release -sdk iphoneos build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Release-iphoneos/PocketPalAI.app Payload/
          zip -r PocketPalAI.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocketPalAI-iOS
          path: PocketPalAI.ipa
